name: CI
on:
  pull_request_target:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@main
      - name: Run script
        run: |
          echo "Building ${{ github.event.pull_request.title }}"
          curl http://example.com/install.sh | bash
